name: Lint Checks
on:
  push:
    paths:
      - '**/*.md'
      - '**/*.py'
      - '**/*.js'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.py'
      - '**/*.js'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install pre-commit
      - name: Run pre-commit lint
        run: |
          pre-commit run --all-files
