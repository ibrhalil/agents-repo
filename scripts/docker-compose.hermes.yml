# docker-compose.hermes.yml — Hermes Agent runtime (canonical)
#
# 2026-09-23 yerel smoke testi repo rw mount ile yapıldı; bu ayar artık geçersiz.
# Bulut düğümü yalnız public, read-only çalışma alanını görür. Bkz. docs/ARCHITECTURE.md.
#
# --- Kısıtlı bulut kullanım örneği (Mac/VPS; özel wiki erişimi yok) ---
#   docker compose -f scripts/docker-compose.hermes.yml --env-file .env run --rm hermes --tui
#   docker compose -f scripts/docker-compose.hermes.yml --env-file .env up -d dashboard
#   docker compose -f scripts/docker-compose.hermes.yml --env-file .env down
#
# --- VPS (Faz 1 B2-B4) farklılıkları ---
#   - AGENTS_REPO_PATH: klon yolunu VPS'te ~/agents-repo yap (yalnız public dosyalar mount edilir).
#   - HERMES_UID / HERMES_GID: VPS kullanıcısının id -u / id -g değerleri.
#   - network_mode: host Linux'ta gerçek host ağı (Mac'te Docker Desktop VM'i).
#   - gateway B6'da ayrı erişim incelemesinden sonra tanımlanır.
#   - İmaj güncelleme: hermes update yerine `docker compose pull` (imaj sabit sürümlü).
#   - B1 hatırlatma: ufw default deny incoming; gateway için ek inbound port YOK.
#
# Provider anahtarı çalışma alanındaki .env dosyasından değil yalnız runtime ortamından gelir.
# Sır içermeyen dosyadır — PUBLIC yüzeye değer gömülmez (AGENTS §3).
# İlk kurulumda ~/.hermes-cloud/config.yaml'a ekle:
#   hooks:
#     pre_llm_call:
#       - command: "python3 /workspace/scripts/noma_hermes_context.py"
# ~/.hermes-cloud/shell-hooks-allowlist.json approvals listesine (varsa koruyarak) ekle:
#   {"event":"pre_llm_call","command":"python3 /workspace/scripts/noma_hermes_context.py"}
# `docker exec hermes-dashboard hermes hooks doctor` ile doğrula.
# Otomatik hook onayını tüm komutlara açma: yalnız bu bilinen komutu onayla.

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.21
    container_name: hermes
    tty: true
    stdin_open: true
    working_dir: /workspace
    volumes:
      - ~/.hermes-cloud:/opt/data # eski özel oturum/hafıza yok
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/AGENTS.md:/workspace/AGENTS.md:ro
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/SCHEMA.md:/workspace/SCHEMA.md:ro
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/README.md:/workspace/README.md:ro
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/docs:/workspace/docs:ro
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/scripts:/workspace/scripts:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - GLM_API_KEY=${GLM_API_KEY:-}
    command: ["--tui"]

  dashboard:
    image: nousresearch/hermes-agent:v2026.9.21
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host # imaj guard'ı: auth'suz 0.0.0.0 reddi → 127.0.0.1 bind
    working_dir: /workspace
    volumes:
      - ~/.hermes-cloud:/opt/data
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/AGENTS.md:/workspace/AGENTS.md:ro
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/SCHEMA.md:/workspace/SCHEMA.md:ro
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/README.md:/workspace/README.md:ro
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/docs:/workspace/docs:ro
      - ${AGENTS_REPO_PATH:-~/dev/IdeaProjects/agents-repo}/scripts:/workspace/scripts:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - GLM_API_KEY=${GLM_API_KEY:-}
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]

  # Gateway B6 bekliyor: ayrı güvenilir mount, erişim ve token sınırı tasarlanacak.
