repos:
  # Sözleşme linter'ı normal commit akışında da koşar (staged blob/silme/append
  # denetimleri commit kapısıdır; kilitli düğümde ERR CRYPT bilinçli durumdur).
  - repo: local
    hooks:
      - id: noma-lint
        name: noma sözleşme linter
        entry: python3 scripts/noma_lint.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(raw|wiki|log|plans|index|agent/(prompts|sessions))/|^index\.md$'
      - id: end-of-file-fixer
        exclude: '^(raw|wiki|log|plans|index|agent/(prompts|sessions))/|^index\.md$'
      - id: check-yaml
        exclude: '^(raw|wiki|log|plans|index|agent/(prompts|sessions))/|^index\.md$'
      - id: check-merge-conflict
        exclude: '^(raw|wiki|log|plans|index|agent/(prompts|sessions))/|^index\.md$'
      - id: mixed-line-ending
        args: ['--fix=no']
        exclude: '^(raw|wiki|log|plans|index|agent/(prompts|sessions))/|^index\.md$'

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: markdownlint (public docs)
        files: '^docs/.*\.md$'
        args:
          - '--config=.markdownlint.yaml'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: relaxed, rules: {line-length: {max: 120}}}']
        exclude: '^(raw|wiki|log|plans|index|agent/(prompts|sessions))/|^index\.md$|^\.github/'
